name: Deploy to OVH

# Tout ce qui est mergé dans main part en production sur nantespvb.fr.
# Lancement manuel possible, avec un mode "essai à blanc" qui liste les fichiers
# qui seraient transférés sans rien écrire — à utiliser au moindre doute.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        default: deploy
        options:
          - deploy
          - dry-run
          - diagnose

concurrency:
  # Deux déploiements simultanés écriraient par-dessus les mêmes fichiers.
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint PHP
        # Un fichier PHP cassé mis en ligne rend tout le site blanc : on vérifie
        # la syntaxe avant d'envoyer quoi que ce soit.
        #
        # short_open_tag=On est indispensable : le code hérité utilise les balises
        # courtes `<?`. Sans cette option, PHP prend ces blocs pour du HTML et
        # accuse à tort accueil.inc.php d'une accolade non fermée — le job
        # échouerait sur tous les déploiements. La prod OVH a bien l'option activée.
        run: |
          find . -path ./.git -prune -o -name '*.php' -print \
            | xargs -r -n1 php -d short_open_tag=On -l

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnostic serveur
        # Mode "diagnose" : on ne transfère rien, on regarde juste qui possède quoi
        # sur la prod. Sert à comprendre un refus d'écriture (mkstemp / Permission
        # denied) sans avoir à tâtonner en modifiant le déploiement.
        if: ${{ inputs.mode == 'diagnose' }}
        env:
          SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          SSH_USER: ${{ secrets.OVH_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.OVH_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "id; echo '--- racine ---'; ls -la '$DEPLOY_PATH' | head -40; \
             echo '--- sous-dossiers ---'; \
             ls -ld '$DEPLOY_PATH'/Documents '$DEPLOY_PATH'/Images \
                    '$DEPLOY_PATH'/app '$DEPLOY_PATH'/mobile-api \
                    '$DEPLOY_PATH'/.well-known 2>&1"

      - name: Deploy to OVH via rsync
        if: ${{ inputs.mode != 'diagnose' }}
        env:
          SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          SSH_USER: ${{ secrets.OVH_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.OVH_DEPLOY_PATH }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          # Pas de --delete : la prod contient des fichiers absents du dépôt
          # (config.php, _passwrds.inc.php, sessions/, Images/contenu/...).
          # Les supprimer casserait le site. Un fichier retiré du dépôt doit
          # donc être supprimé à la main sur le serveur.
          #
          # --no-perms : les fichiers existants sur la prod n'appartiennent pas
          # tous au compte de déploiement ; tenter de leur imposer un mode échoue.
          # On laisse le serveur appliquer son umask.
          opts=(-rlvz --no-perms --exclude-from=.github/rsync-exclude.txt)

          if [ "${MODE:-deploy}" = "dry-run" ]; then
            opts+=(--dry-run --checksum --itemize-changes)
            echo "::notice::Essai à blanc — aucune écriture, comparaison par somme de contrôle"
          fi

          rsync "${opts[@]}" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Déploiement vers OVH échoué — la prod n'a pas été mise à jour"
          exit 1
